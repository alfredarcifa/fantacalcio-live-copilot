name: Deploy Fantacalcio Live Copilot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Fantacalcio datasets when available
        id: fantacalcio_download
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .cache/fantacalcio
          QUOTES_OK=false
          STATS_OK=false

          if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 \
            "https://www.fantacalcio.it/api/v1/Excel/prices/21/1" \
            --output .cache/fantacalcio/quotazioni.xlsx; then
            test -s .cache/fantacalcio/quotazioni.xlsx && QUOTES_OK=true
          else
            rm -f .cache/fantacalcio/quotazioni.xlsx
          fi

          if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 \
            "https://www.fantacalcio.it/api/v1/Excel/stats/21/1" \
            --output .cache/fantacalcio/statistiche.xlsx; then
            test -s .cache/fantacalcio/statistiche.xlsx && STATS_OK=true
          else
            rm -f .cache/fantacalcio/statistiche.xlsx
          fi

          echo "quotes_ok=$QUOTES_OK" >> "$GITHUB_OUTPUT"
          echo "stats_ok=$STATS_OK" >> "$GITHUB_OUTPUT"

          if [[ "$QUOTES_OK" != "true" || "$STATS_OK" != "true" ]]; then
            echo "::warning::Fantacalcio datasets unavailable. Using the versioned fallback dataset."
          fi

      - name: Verify versioned fallback dataset
        if: steps.fantacalcio_download.outputs.quotes_ok != 'true' || steps.fantacalcio_download.outputs.stats_ok != 'true'
        shell: bash
        run: |
          test -s src/data/players.js
          echo "Using versioned fallback dataset: src/data/players.js"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
