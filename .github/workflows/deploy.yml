name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh player dataset, keep fallback on failure
        run: |
          python scripts/update_fantacalcio.py \
            --urls \
              "https://raw.githubusercontent.com/bqit/fantaleghe-api-json/main/players.json" \
              "https://cdn.jsdelivr.net/gh/bqit/fantaleghe-api-json@main/players.json" \
            --strategy src/data/player-strategy.json \
            --all-output src/data/all-players.generated.json \
            --metadata-output src/data/data-metadata.json \
            --minimum 100
      - name: Define visible build version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "VITE_APP_VERSION=2.5.${GITHUB_RUN_NUMBER}+${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "VITE_DEPLOYED_AT=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify build output and visible version
        run: |
          test -f dist/index.html
          grep -R --fixed-strings "$VITE_APP_VERSION" dist >/dev/null
          echo "Published build: $VITE_APP_VERSION"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
