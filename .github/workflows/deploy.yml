name: Update data and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh dataset safely
        run: |
          python scripts/update_fantacalcio.py \
            --urls "https://raw.githubusercontent.com/bqit/fantaleghe-api-json/main/players.json" "https://cdn.jsdelivr.net/gh/bqit/fantaleghe-api-json@main/players.json" \
            --strategy src/data/player-strategy.json \
            --all-output src/data/all-players.generated.json \
            --metadata-output src/data/data-metadata.json \
            --minimum 100
      - name: Define visible build
        run: |
          echo "VITE_APP_VERSION=2.7.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VITE_DEPLOYED_AT=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -f dist/index.html && grep -R --fixed-strings "$VITE_APP_VERSION" dist >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
