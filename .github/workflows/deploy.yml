name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and normalize live player data
        env:
          PLAYERS_SOURCE_URL: https://cdn.jsdelivr.net/gh/bqit/fantaleghe-api-json@main/players.json
        run: python scripts/update_fantacalcio.py --url "$PLAYERS_SOURCE_URL" --output src/players.json
      - name: Verify generated dataset
        run: |
          python - <<'PY'
          import json
          players=json.load(open('src/players.json',encoding='utf-8'))
          assert len(players)>=400, f'Dataset incompleto: {len(players)}'
          assert all(p.get('name') and p.get('role') for p in players)
          print(f'Dataset valido: {len(players)} giocatori')
          PY
      - name: Define visible build version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "VITE_APP_VERSION=1.0.${GITHUB_RUN_NUMBER}+${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "VITE_DEPLOYED_AT=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build application
        run: npm run build
      - name: Verify build output and version
        run: |
          test -f dist/index.html
          grep -R --fixed-strings "$VITE_APP_VERSION" dist >/dev/null
          echo "Published build: $VITE_APP_VERSION"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
