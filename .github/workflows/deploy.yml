name: Update Fantacalcio data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data pipeline dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download official Fantacalcio datasets
        run: |
          mkdir -p .cache/fantacalcio
          curl --fail --location --retry 3 --retry-all-errors \
            "https://www.fantacalcio.it/api/v1/Excel/prices/21/1" \
            --output .cache/fantacalcio/quotazioni.xlsx
          curl --fail --location --retry 3 --retry-all-errors \
            "https://www.fantacalcio.it/api/v1/Excel/stats/21/1" \
            --output .cache/fantacalcio/statistiche.xlsx
          test -s .cache/fantacalcio/quotazioni.xlsx
          test -s .cache/fantacalcio/statistiche.xlsx

      - name: Merge official data with auction strategy
        run: |
          cp src/players.json .cache/fantacalcio/player-strategy.json
          python scripts/update_fantacalcio.py \
            --prices .cache/fantacalcio/quotazioni.xlsx \
            --stats .cache/fantacalcio/statistiche.xlsx \
            --strategy .cache/fantacalcio/player-strategy.json \
            --output src/players.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
